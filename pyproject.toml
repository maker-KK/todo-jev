[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-jev"
version = "0.1.0"
description = "Fast, low-cost intelligent task classifier and 3-tier routing engine powered by TypeSafe Jev (System One)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "maker-KK"}
]
keywords = ["jev", "system-one", "ai-agents", "task-router", "typesafe", "classification"]
dependencies = [
    "typesafe-sdk>=0.6.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.scripts]
todo-jev = "app.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
